<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Share</title>
<meta name="description" content="Run it on your PC, scan the QR code with your phone, and send files and text. No internet, accounts or database.">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --mut:#8b949e; --acc:#2f81f7; color-scheme:dark light }
  @media (prefers-color-scheme: light) { :root { --bg:#f0f3f6; --card:#fff; --line:#d1d9e0; --fg:#1f2328; --mut:#59636e; --acc:#0969da } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif }
  main { width:min(440px,100%); text-align:center }
  img { width:72px; height:72px; border-radius:16px }
  h1 { margin:14px 0 6px; font-size:1.8rem }
  p { margin:0 0 22px; color:var(--mut) }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap }
  a.btn { padding:11px 20px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); text-decoration:none; font-weight:650 }
  a.pri { background:var(--acc); border-color:var(--acc); color:#fff }
  a.btn:hover { filter:brightness(1.1) }
  small { display:block; margin-top:22px; color:var(--mut) }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>LAN Share</h1>
  <p>Run it on your PC, scan the QR code with your phone, and send files and text. No internet, no accounts, no database.</p>
  <div class="btns">
    <a class="btn pri" href="https://github.com/Ravitej6191/LAN-Sync/archive/refs/heads/main.zip">Download</a>
    <a class="btn" href="https://github.com/Ravitej6191/LAN-Sync#readme">Setup guide</a>
  </div>
  <small>Needs Node.js on your PC. Unzip and double-click start.bat.</small>
</main>
</body>
</html>
